<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冒泡排序可视化</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2em;
        }

        .input-section {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-start {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-start:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-reset {
            background: #f44336;
            color: white;
        }

        .btn-reset:hover {
            background: #da190b;
        }

        .visualization {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 10px;
            min-height: 300px;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .bar {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            color: white;
            font-weight: bold;
            font-size: 18px;
            transition: all 0.3s ease;
            min-width: 40px;
            position: relative;
        }

        .bar.sorted {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        .bar.comparing {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            transform: scale(1.05);
        }

        .bar.swapping {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            transform: scale(1.1);
        }

        .info {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-top: 10px;
        }

        .status {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-top: 15px;
            min-height: 25px;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #666;
        }

        .legend-color {
            width: 30px;
            height: 20px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>冒泡排序可视化</h1>

        <div class="input-section">
            <input type="text" id="arrayInput" placeholder="输入数字，用逗号分隔（如：64, 34, 25, 12, 22, 11, 90）" value="64, 34, 25, 12, 22, 11, 90">
            <button class="btn-start" id="startBtn" onclick="startSort()">开始排序</button>
            <button class="btn-reset" onclick="reset()">重置</button>
        </div>

        <div class="visualization" id="visualization"></div>

        <div class="status" id="status">点击"开始排序"按钮开始动画</div>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-color" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);"></div>
                <span>未排序</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);"></div>
                <span>已排序</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);"></div>
                <span>比较中</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);"></div>
                <span>交换中</span>
            </div>
        </div>
    </div>

    <script>
        let array = [];
        let isSorting = false;

        function parseArray() {
            const input = document.getElementById('arrayInput').value;
            return input.split(',')
                .map(num => parseInt(num.trim()))
                .filter(num => !isNaN(num));
        }

        function displayArray(comparing = [], swapping = [], sorted = []) {
            const visualization = document.getElementById('visualization');
            const maxVal = Math.max(...array);
            visualization.innerHTML = '';

            array.forEach((value, index) => {
                const bar = document.createElement('div');
                bar.className = 'bar';
                bar.textContent = value;

                const height = (value / maxVal) * 200 + 40;
                bar.style.height = `${height}px`;

                if (sorted.includes(index)) {
                    bar.classList.add('sorted');
                }
                if (comparing.includes(index)) {
                    bar.classList.add('comparing');
                }
                if (swapping.includes(index)) {
                    bar.classList.add('swapping');
                }

                visualization.appendChild(bar);
            });
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        async function swap(i, j) {
            const temp = array[i];
            array[i] = array[j];
            array[j] = temp;
        }

        async function bubbleSort() {
            const n = array.length;
            const sorted = [];

            for (let i = 0; i < n - 1; i++) {
                for (let j = 0; j < n - i - 1; j++) {
                    if (!isSorting) return;

                    // 显示比较
                    displayArray([j, j + 1], [], sorted);
                    document.getElementById('status').textContent = `比较 ${array[j]} 和 ${array[j + 1]}`;
                    await sleep(500);

                    if (array[j] > array[j + 1]) {
                        // 显示交换
                        displayArray([], [j, j + 1], sorted);
                        document.getElementById('status').textContent = `交换 ${array[j]} 和 ${array[j + 1]}`;
                        await swap(j, j + 1);
                        await sleep(500);
                    }
                }
                sorted.unshift(n - 1 - i);
                displayArray([], [], sorted);
            }
            sorted.unshift(0);
            displayArray([], [], sorted);
            document.getElementById('status').textContent = '排序完成！';
        }

        async function startSort() {
            if (isSorting) return;

            array = parseArray();
            if (array.length === 0) {
                document.getElementById('status').textContent = '请输入有效的数字数组';
                return;
            }

            isSorting = true;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('arrayInput').disabled = true;

            displayArray();
            await bubbleSort();

            isSorting = false;
            document.getElementById('startBtn').disabled = false;
            document.getElementById('arrayInput').disabled = false;
        }

        function reset() {
            isSorting = false;
            array = parseArray();
            document.getElementById('startBtn').disabled = false;
            document.getElementById('arrayInput').disabled = false;
            document.getElementById('status').textContent = '点击"开始排序"按钮开始动画';

            if (array.length > 0) {
                displayArray();
            }
        }

        // 初始化显示
        reset();
    </script>
</body>
</html>
