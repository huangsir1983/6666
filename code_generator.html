<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 代码生成器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            color: #e4e4e7;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .panel {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header {
            grid-column: 1 / -1;
            text-align: center;
            padding: 30px;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 2.5em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .panel h2 {
            margin-bottom: 20px;
            color: #667eea;
            font-size: 1.3em;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #a1a1aa;
            font-size: 0.9em;
        }

        .input-group input,
        .input-group select,
        .input-group textarea {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #e4e4e7;
            font-family: 'Courier New', monospace;
            font-size: 0.95em;
        }

        .input-group input:focus,
        .input-group select:focus,
        .input-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .code-output {
            background: #1e1e1e;
            border-radius: 10px;
            padding: 20px;
            min-height: 400px;
            overflow: auto;
            position: relative;
        }

        .code-output pre {
            margin: 0;
            color: #d4d4d4;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 0.9em;
            line-height: 1.6;
        }

        .code-output .copy-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 8px 15px;
            background: #667eea;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            font-size: 0.85em;
            width: auto;
            margin: 0;
        }

        .code-output .copy-btn:hover {
            transform: none;
            background: #764ba2;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #71717a;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(102, 126, 234, 0.3);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .template-btn {
            background: rgba(102, 126, 234, 0.2);
            border: 1px solid rgba(102, 126, 234, 0.5);
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            margin: 5px;
            font-size: 0.9em;
        }

        .template-btn:hover {
            background: rgba(102, 126, 234, 0.4);
            transform: translateY(-2px);
        }

        .templates {
            display: flex;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>💻 AI 代码生成器</h1>
        <p style="color: #71717a;">由智谱 GLM-4.7 驱动的智能编程助手</p>
    </div>

    <div class="container">
        <div class="panel">
            <h2>📝 配置需求</h2>

            <div class="input-group">
                <label>编程语言</label>
                <select id="language">
                    <option value="Python">Python</option>
                    <option value="JavaScript">JavaScript</option>
                    <option value="HTML/CSS">HTML/CSS</option>
                    <option value="SQL">SQL</option>
                    <option value="Bash">Bash</option>
                    <option value="Java">Java</option>
                    <option value="C++">C++</option>
                </select>
            </div>

            <div class="input-group">
                <label>代码类型</label>
                <select id="codeType">
                    <option value="函数">函数</option>
                    <option value="类">类</option>
                    <option value="完整程序">完整程序</option>
                    <option value="算法">算法实现</option>
                    <option value="数据处理">数据处理</option>
                    <option value="网络请求">网络请求</option>
                </select>
            </div>

            <div class="input-group">
                <label>需求描述</label>
                <textarea id="description" placeholder="详细描述你需要的功能...

例如：
- 创建一个快速排序算法
- 实现一个二叉树遍历
- 写一个用户登录表单验证函数"></textarea>
            </div>

            <div class="input-group">
                <label>额外要求（可选）</label>
                <textarea id="requirements" placeholder="例如：
- 添加错误处理
- 包含注释
- 使用递归实现
- 时间复杂度 O(n)"></textarea>
            </div>

            <button onclick="generateCode()" id="generateBtn">生成代码</button>
        </div>

        <div class="panel">
            <h2>📄 生成的代码</h2>

            <div class="code-output" id="codeOutput">
                <div class="loading" style="padding-top: 150px;">
                    <p style="color: #71717a; font-size: 1.2em;">等待生成代码...</p>
                    <p style="margin-top: 10px; font-size: 0.9em;">在左侧输入你的需求</p>
                </div>
            </div>

            <div class="templates">
                <button class="template-btn" onclick="loadTemplate('sort')">快速排序</button>
                <button class="template-btn" onclick="loadTemplate('api')">API 请求</button>
                <button class="template-btn" onclick="loadTemplate('tree')">二叉树</button>
                <button class="template-btn" onclick="loadTemplate('filter')">数据过滤</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api/anthropic/v1/messages';
        const API_KEY = 'dummy_key';

        const templates = {
            'sort': {
                language: 'Python',
                codeType: '算法',
                description: '实现快速排序算法，包含递归和迭代两种版本',
                requirements: '添加详细注释，说明时间复杂度'
            },
            'api': {
                language: 'JavaScript',
                codeType: '函数',
                description: '实现一个通用的 HTTP GET 请求函数，支持超时和错误处理',
                requirements: '使用 Fetch API，添加重试机制'
            },
            'tree': {
                language: 'Python',
                codeType: '类',
                description: '实现一个二叉树类，包含插入、删除、搜索和遍历方法',
                requirements: '包含中序、前序、后序遍历'
            },
            'filter': {
                language: 'Python',
                codeType: '函数',
                description: '实现一个通用的数据过滤函数，支持多条件过滤',
                requirements: '使用 lambda 表达式，支持嵌套条件'
            }
        };

        function loadTemplate(name) {
            const template = templates[name];
            document.getElementById('language').value = template.language;
            document.getElementById('codeType').value = template.codeType;
            document.getElementById('description').value = template.description;
            document.getElementById('requirements').value = template.requirements;
        }

        async function generateCode() {
            const language = document.getElementById('language').value;
            const codeType = document.getElementById('codeType').value;
            const description = document.getElementById('description').value;
            const requirements = document.getElementById('requirements').value;

            if (!description.trim()) {
                alert('请输入需求描述！');
                return;
            }

            const codeOutput = document.getElementById('codeOutput');
            const generateBtn = document.getElementById('generateBtn');

            generateBtn.disabled = true;
            codeOutput.innerHTML = `
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>AI 正在生成代码...</p>
                </div>
            `;

            const prompt = `请用 ${language} 编写${codeType}。

需求：
${description}

${requirements ? `额外要求：
${requirements}` : ''}

要求：
1. 代码质量高，符合最佳实践
2. 添加必要的注释
3. 包含使用示例
4. 如果适用，添加错误处理`;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': API_KEY
                    },
                    body: JSON.stringify({
                        model: 'claude-sonnet-4-5-20250929',
                        max_tokens: 2000,
                        messages: [{ role: 'user', content: prompt }]
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                const code = data.content[0].text;

                // 格式化代码输出
                codeOutput.innerHTML = `
                    <button class="copy-btn" onclick="copyCode()">复制代码</button>
                    <pre>${escapeHtml(code)}</pre>
                `;

            } catch (error) {
                console.error('Error:', error);
                codeOutput.innerHTML = `
                    <div class="loading" style="color: #f56565;">
                        <p>❌ 生成失败</p>
                        <p style="margin-top: 10px; font-size: 0.9em;">${error.message}</p>
                    </div>
                `;
            }

            generateBtn.disabled = false;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function copyCode() {
            const codeText = document.querySelector('#codeOutput pre').textContent;
            navigator.clipboard.writeText(codeText).then(() => {
                alert('代码已复制到剪贴板！');
            }).catch(err => {
                alert('复制失败，请手动复制');
            });
        }
    </script>
</body>
</html>
